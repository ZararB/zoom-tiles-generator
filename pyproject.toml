[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-tiles-generator"
version = "0.1.0"
description = "Versioned map geometry, live zoom-aware rendering, and optional asynchronous GPU tile refinement"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "ZararB"}]
dependencies = ["shapely==2.2.0", "pyproj==3.8.0", "requests>=2.32,<3", "Pillow>=10.4,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
gpu = ["torch>=2.6", "diffusers==0.30.3", "transformers==4.44.2", "accelerate==1.10.1", "safetensors>=0.4.4", "huggingface-hub>=0.24,<1"]
mlops = ["mlflow>=2.16,<4"]

[tool.setuptools.packages.find]
include = ["zoom_tiles*"]

[tool.setuptools.package-data]
zoom_tiles = ["assets/*-atlas.webp"]
